# Local H2 profile for instant standalone running
# Run with: .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=h2"
spring.datasource.url=jdbc:h2:mem:ranktracker;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8085
tracker.check-cron=0 0 6 * * *
search.api-key=${SEARCH_API_KEY:your_searchapi_key_here}
