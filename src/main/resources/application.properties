spring.application.name=ranktracker

# ── MySQL ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/ranktracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── SearchAPI ──────────────────────────────────────────
search.api-key=${SEARCH_API_KEY:your_searchapi_key_here}

# ── Scheduling ─────────────────────────────────────────
tracker.check-cron=0 0 6 * * *

# ── Server ─────────────────────────────────────────────
server.port=8085
